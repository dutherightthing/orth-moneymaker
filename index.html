<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orth Moneymaker</title>
<link rel="icon" href="assets/orth-logo.jpg" />
<style>
  :root{
    --gold:#d4af37;
    --bg:#0d0d0d;
    --red:#a8121f;
    --black:#141414;
    --card:#171717;
    --ink:#fff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:26px;
    background:var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, ui-sans-serif, sans-serif;
    color:var(--ink);
    overflow-x:hidden;
    padding:36px 16px;
  }

  header{ display:flex; flex-direction:column; align-items:center; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand img{ width:34px; height:34px; border-radius:8px; }
  .brand h1{
    font-size:clamp(28px, 8vw, 44px);
    font-weight:900;
    letter-spacing:0.02em;
    margin:0;
    color:var(--gold);
    white-space:nowrap;
  }

  .stage{ position:relative; display:flex; flex-direction:column; align-items:center; gap:30px; }

  .pointer{
    position:absolute;
    top:-18px; left:50%;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:18px solid transparent;
    border-right:18px solid transparent;
    border-top:30px solid var(--gold);
    z-index:5;
  }

  .wheel-wrap{
    position:relative;
    width:min(90vw, 440px);
    height:min(90vw, 440px);
    border-radius:50%;
    padding:10px;
    background:var(--gold);
    box-shadow:0 24px 50px -15px rgba(0,0,0,0.65);
  }
  .dial{
    position:relative;
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
    transform:rotate(0deg);
    transition: transform 4.4s cubic-bezier(0.16, 0.86, 0.2, 1);
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.5);
  }
  .seg-label{
    position:absolute;
    top:50%; left:50%;
    width:39%;
    height:0;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    transform-origin:left center;
    pointer-events:none;
  }
  .seg-label .stack{
    display:flex;
    flex-direction:row;
    align-items:center;
    gap:5px;
    max-width:102px;
  }
  .seg-label .logo-badge{
    width:27px; height:27px;
    border-radius:7px;
    overflow:hidden;
    flex:none;
  }
  .seg-label .logo-badge img{ width:100%; height:100%; display:block; object-fit:cover; }
  .seg-label span{
    display:block;
    color:#fff;
    font-weight:800;
    font-size:10.5px;
    line-height:1.1;
    text-align:left;
    text-transform:uppercase;
    letter-spacing:0.01em;
  }

  .hub{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:82px; height:82px;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 0 4px var(--gold), 0 6px 16px rgba(0,0,0,0.5);
    z-index:4;
  }
  .hub img{ width:46px; height:46px; border-radius:9px; object-fit:cover; }

  .spin-btn{
    appearance:none;
    border:3px solid var(--gold);
    cursor:pointer;
    background:var(--black);
    color:var(--gold);
    font-size:clamp(18px, 5vw, 24px);
    font-weight:900;
    letter-spacing:0.06em;
    padding:18px 56px;
    border-radius:999px;
    text-transform:uppercase;
    transition: transform 0.15s ease;
  }
  .spin-btn:hover{ transform:translateY(-1px); }
  .spin-btn:active{ transform:translateY(1px) scale(0.98); }
  .spin-btn:disabled{ opacity:0.5; cursor:default; transform:none; }

  /* gear */
  .gear-btn{
    position:fixed;
    top:18px; right:18px;
    width:38px; height:38px;
    border-radius:50%;
    border:1.5px solid var(--gold);
    background:var(--black);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:15;
  }
  .gear-btn svg{ width:18px; height:18px; }
  .gear-btn:hover{ background:#222; }

  /* settings panel */
  .backdrop{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.6);
    opacity:0; pointer-events:none;
    transition:opacity 0.2s ease;
    z-index:20;
  }
  .backdrop.open{ opacity:1; pointer-events:auto; }

  .panel{
    position:fixed;
    top:0; right:0;
    height:100%;
    width:min(340px, 88vw);
    background:var(--card);
    border-left:1px solid #2a2a2a;
    transform:translateX(100%);
    transition:transform 0.25s ease;
    z-index:21;
    padding:22px;
    overflow-y:auto;
    color:#f2ede1;
  }
  .panel.open{ transform:translateX(0); }
  .panel h2{ font-size:16px; margin:0 0 4px; color:var(--gold); }
  .panel .sub{ font-size:12.5px; color:rgba(242,237,225,0.5); margin:0 0 18px; }
  .panel .close{
    position:absolute; top:18px; right:18px;
    border:none; background:none; font-size:18px; cursor:pointer; color:rgba(242,237,225,0.6);
  }

  .mode-row{
    display:flex; gap:8px; margin-bottom:16px;
    background:#0d0d0d; padding:4px; border-radius:12px;
  }
  .mode-row button{
    flex:1; border:none; background:transparent;
    padding:9px 8px; border-radius:9px; font-size:13px; font-weight:700;
    cursor:pointer; color:rgba(242,237,225,0.5);
  }
  .mode-row button.active{ background:var(--gold); color:#1a1408; }

  .use-case-list{ display:flex; flex-direction:column; gap:8px; }
  .use-case-list.disabled{ opacity:0.35; pointer-events:none; }
  .uc-row{
    display:flex; align-items:center; gap:10px;
    padding:9px 12px; border-radius:10px;
    border:1.5px solid #2a2a2a;
    cursor:pointer; font-size:13.5px; font-weight:600;
  }
  .uc-row .logo-badge{ width:26px; height:26px; border-radius:7px; overflow:hidden; flex:none; }
  .uc-row .logo-badge img{ width:100%; height:100%; object-fit:cover; }
  .uc-row.selected{ border-color:var(--gold); background:rgba(212,175,55,0.08); }
  .uc-row input{ display:none; }

  /* result overlay */
  .result-backdrop{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.75);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity 0.25s ease;
    z-index:30;
    padding:20px;
  }
  .result-backdrop.open{ opacity:1; pointer-events:auto; }
  .result-card{
    background:var(--card);
    border:2px solid var(--gold);
    border-radius:24px;
    max-width:360px;
    width:100%;
    padding:40px 28px 32px;
    text-align:center;
    transform:scale(0.85) translateY(10px);
    transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    color:#fff;
  }
  .result-backdrop.open .result-card{ transform:scale(1) translateY(0); }
  .result-logos{
    display:flex; align-items:center; justify-content:center;
    gap:16px; margin-bottom:26px;
  }
  .result-logos .logo-badge{ width:64px; height:64px; border-radius:16px; overflow:hidden; flex:none; }
  .result-logos .logo-badge img{ width:100%; height:100%; object-fit:cover; }
  .result-logos .x{ font-size:22px; font-weight:800; color:var(--gold); }
  .result-card h3{
    font-size:clamp(24px, 7vw, 32px);
    margin:0;
    letter-spacing:0.01em;
    text-transform:uppercase;
    font-weight:900;
    color:#fff;
  }
  .again-btn{
    appearance:none; border:2px solid var(--gold); cursor:pointer;
    background:var(--black); color:var(--gold); font-weight:800; font-size:14px;
    text-transform:uppercase; letter-spacing:0.04em;
    padding:12px 22px; border-radius:999px; width:100%;
    margin-top:28px;
  }
</style>
</head>
<body>

  <button class="gear-btn" id="gearBtn" title="Settings" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M19.4 13a7.6 7.6 0 0 0 .07-1 7.6 7.6 0 0 0-.07-1l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.5 7.5 0 0 0-1.73-1L14.5 2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.42 2.6a7.5 7.5 0 0 0-1.73 1l-2.39-.96a.5.5 0 0 0-.6.22L2.44 8.78a.5.5 0 0 0 .12.64L4.6 11a7.6 7.6 0 0 0 0 2l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96a7.5 7.5 0 0 0 1.73 1l.42 2.6a.5.5 0 0 0 .5.4h4a.5.5 0 0 0 .5-.4l.42-2.6a7.5 7.5 0 0 0 1.73-1l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64L19.4 13Z" stroke="#d4af37" stroke-width="1.4" stroke-linejoin="round"/>
      <circle cx="12" cy="12" r="3.2" stroke="#d4af37" stroke-width="1.4"/>
    </svg>
  </button>

  <header>
    <div class="brand">
      <img src="assets/orth-logo.jpg" alt="Orthogonal" />
      <h1>ORTH MONEYMAKER</h1>
    </div>
  </header>

  <div class="stage">
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <div class="dial" id="dial"></div>
      <div class="hub"><img src="assets/orth-logo.jpg" alt="" /></div>
    </div>
    <button class="spin-btn" id="spinBtn">SPIN</button>
  </div>

  <div class="backdrop" id="backdrop"></div>
  <div class="panel" id="panel">
    <button class="close" id="closePanel">✕</button>
    <h2>Settings</h2>
    <p class="sub">Choose how the wheel picks its result.</p>

    <div class="mode-row">
      <button id="modeRandom" class="active">Random</button>
      <button id="modeLocked">Set the winner</button>
    </div>

    <div class="use-case-list disabled" id="ucList"></div>
  </div>

  <div class="result-backdrop" id="resultBackdrop">
    <div class="result-card">
      <div class="result-logos">
        <div class="logo-badge"><img id="rLogo" src="" alt="" /></div>
        <span class="x">×</span>
        <div class="logo-badge"><img src="assets/orth-logo.jpg" alt="Orthogonal" /></div>
      </div>
      <h3 id="rTitle">Title</h3>
      <button class="again-btn" id="againBtn">Spin again</button>
    </div>
  </div>

<script>
  // Source: Orthogonal "Use Case Playground" sheet, reframed as recognizable
  // money-making plays for on-camera reveals.
  const SEGMENTS = [
    { label: "AD SPY",        logo: "assets/logos/facebook.svg" },
    { label: "HOOK SPY",      logo: "assets/logos/tiktok.svg" },
    { label: "CLOUT CHECK",   logo: "assets/logos/instagram.png" },
    { label: "DEAL BOT",      logo: "assets/logos/amazon.svg" },
    { label: "LOCAL LEADS",   logo: "assets/logos/googlemaps.svg" },
    { label: "COLD EMAIL",    logo: "assets/logos/gmail.svg" },
    { label: "JOB SNIPE",     logo: "assets/logos/linkedin.png" },
    { label: "SHOPIFY SPY",   logo: "assets/logos/shopify.svg" }
  ];

  const N = SEGMENTS.length;
  const SEG_ANGLE = 360 / N;
  const RED = "#a8121f";
  const BLK = "#141414";
  const GOLD = "#d4af37";
  const SEAM = 0.9;

  const dial = document.getElementById('dial');
  const ucList = document.getElementById('ucList');

  const stops = [];
  for (let i = 0; i < N; i++) {
    const start = i * SEG_ANGLE;
    const end = (i + 1) * SEG_ANGLE;
    const color = i % 2 === 0 ? RED : BLK;
    stops.push(`${GOLD} ${start}deg ${start + SEAM}deg`);
    stops.push(`${color} ${start + SEAM}deg ${end - SEAM}deg`);
    stops.push(`${GOLD} ${end - SEAM}deg ${end}deg`);
  }
  dial.style.background = `conic-gradient(${stops.join(', ')})`;

  function logoBadge(src, alt){
    const badge = document.createElement('div');
    badge.className = 'logo-badge';
    const img = document.createElement('img');
    img.src = src;
    img.alt = alt || '';
    badge.appendChild(img);
    return badge;
  }

  SEGMENTS.forEach((s, i) => {
    const mid = i * SEG_ANGLE + SEG_ANGLE / 2 - 90;
    const wrap = document.createElement('div');
    wrap.className = 'seg-label';
    wrap.style.transform = `rotate(${mid}deg)`;

    const normalizedMid = ((mid % 360) + 360) % 360;
    const flip = normalizedMid > 90 && normalizedMid < 270;

    const stack = document.createElement('div');
    stack.className = 'stack';
    if (flip) stack.style.transform = 'rotate(180deg)';

    stack.appendChild(logoBadge(s.logo, s.label));
    const span = document.createElement('span');
    span.textContent = s.label;
    stack.appendChild(span);
    wrap.appendChild(stack);
    dial.appendChild(wrap);
  });

  SEGMENTS.forEach((s, i) => {
    const row = document.createElement('label');
    row.className = 'uc-row';
    row.innerHTML = `<input type="radio" name="ucChoice" value="${i}" />`;
    row.appendChild(logoBadge(s.logo, s.label));
    const span = document.createElement('span');
    span.textContent = s.label;
    row.appendChild(span);
    row.addEventListener('click', () => selectLocked(i));
    ucList.appendChild(row);
  });

  // ---- state ----
  let mode = localStorage.getItem('omm_mode') || 'random'; // 'random' | 'locked'
  let lockedIndex = localStorage.getItem('omm_locked');
  lockedIndex = lockedIndex === null || lockedIndex === '' ? null : parseInt(lockedIndex, 10);
  let rotation = 0;
  let spinning = false;

  function saveState(){
    localStorage.setItem('omm_mode', mode);
    localStorage.setItem('omm_locked', lockedIndex === null ? '' : String(lockedIndex));
  }

  function selectLocked(i){
    lockedIndex = i;
    mode = 'locked';
    setModeUI();
    saveState();
  }

  function setModeUI(){
    document.getElementById('modeRandom').classList.toggle('active', mode === 'random');
    document.getElementById('modeLocked').classList.toggle('active', mode === 'locked');
    ucList.classList.toggle('disabled', mode !== 'locked');
    document.querySelectorAll('.uc-row').forEach((row, i) => {
      row.classList.toggle('selected', mode === 'locked' && lockedIndex === i);
    });
  }
  setModeUI();

  // ---- panel open/close ----
  const panel = document.getElementById('panel');
  const backdrop = document.getElementById('backdrop');
  function openPanel(){ panel.classList.add('open'); backdrop.classList.add('open'); }
  function closePanel(){ panel.classList.remove('open'); backdrop.classList.remove('open'); }
  document.getElementById('gearBtn').addEventListener('click', openPanel);
  document.getElementById('closePanel').addEventListener('click', closePanel);
  backdrop.addEventListener('click', closePanel);

  document.getElementById('modeRandom').addEventListener('click', () => {
    mode = 'random'; setModeUI(); saveState();
  });
  document.getElementById('modeLocked').addEventListener('click', () => {
    mode = 'locked';
    if (lockedIndex === null) lockedIndex = 0;
    setModeUI(); saveState();
  });

  // ---- spin logic ----
  const spinBtn = document.getElementById('spinBtn');
  const resultBackdrop = document.getElementById('resultBackdrop');

  function pickTargetIndex(){
    if (mode === 'locked' && lockedIndex !== null) return lockedIndex;
    return Math.floor(Math.random() * N);
  }

  function showResult(i){
    const s = SEGMENTS[i];
    document.getElementById('rLogo').src = s.logo;
    document.getElementById('rTitle').textContent = s.label;
    resultBackdrop.classList.add('open');
  }

  spinBtn.addEventListener('click', () => {
    if (spinning) return;
    spinning = true;
    spinBtn.disabled = true;

    const targetIndex = pickTargetIndex();
    const centerAngle = targetIndex * SEG_ANGLE + SEG_ANGLE / 2;
    const jitter = (Math.random() - 0.5) * SEG_ANGLE * 0.6;
    const targetVisualAngle = ((centerAngle + jitter) % 360 + 360) % 360;

    const currentMod = ((rotation % 360) + 360) % 360;
    const neededForward = ((360 - targetVisualAngle) - currentMod + 360) % 360;
    const extraSpins = 6 + Math.floor(Math.random() * 3); // 6-8 full turns
    rotation += extraSpins * 360 + neededForward;

    dial.style.transform = `rotate(${rotation}deg)`;

    const onDone = () => {
      dial.removeEventListener('transitionend', onDone);
      const normalized = ((rotation % 360) + 360) % 360;
      dial.style.transition = 'none';
      dial.style.transform = `rotate(${normalized}deg)`;
      rotation = normalized;
      void dial.offsetHeight;
      dial.style.transition = '';

      spinning = false;
      spinBtn.disabled = false;
      showResult(targetIndex);
    };
    dial.addEventListener('transitionend', onDone);
  });

  document.getElementById('againBtn').addEventListener('click', () => {
    resultBackdrop.classList.remove('open');
  });
</script>
</body>
</html>
