<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orth Moneymaker</title>
<link rel="icon" href="assets/orth-logo.jpg" />
<style>
  :root{
    --accent:#3B82F6;
    --bg:#0B0B0D;
    --card:#18181B;
    --ink:#F4F7FB;
    --ink-dim: rgba(244,247,251,0.5);
    --surface: rgba(255,255,255,0.08);
    --surface-hover: rgba(255,255,255,0.14);
    --btn-bg:#ffffff;
    --btn-ink:#0b0b0d;
  }
  :root[data-theme="light"]{
    --bg:#F1F2F4;
    --card:#FFFFFF;
    --ink:#0B0B0D;
    --ink-dim: rgba(11,11,13,0.5);
    --surface: rgba(0,0,0,0.05);
    --surface-hover: rgba(0,0,0,0.09);
    --btn-bg:#0B0B0D;
    --btn-ink:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:26px;
    background:var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, ui-sans-serif, sans-serif;
    color:var(--ink);
    overflow-x:hidden;
    padding:36px 16px;
  }

  header{ display:flex; flex-direction:column; align-items:center; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand img{ width:34px; height:34px; border-radius:8px; }
  .brand h1{
    font-size:clamp(22px, 6.8vw, 40px);
    font-weight:900;
    letter-spacing:0.01em;
    margin:0;
    color:var(--ink);
    white-space:nowrap;
  }

  .stage{ position:relative; display:flex; flex-direction:column; align-items:center; gap:30px; }

  .pointer{
    position:absolute;
    top:-4px; left:50%;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:14px solid transparent;
    border-right:14px solid transparent;
    border-top:22px solid #fff;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,0.35));
    z-index:5;
  }

  .wheel-wrap{
    position:relative;
    width:min(92vw, 460px);
    height:min(92vw, 460px);
    border-radius:50%;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.55);
  }
  .dial{
    position:relative;
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
    transform:rotate(0deg);
    transition: transform 4.4s cubic-bezier(0.16, 0.86, 0.2, 1);
  }
  .seg-label{
    position:absolute;
    top:50%; left:50%;
    width:0; height:0;
    pointer-events:none;
  }
  .seg-label .r-item{
    position:absolute;
    top:0; left:0;
  }
  .seg-label .logo-badge{
    width:37px; height:37px;
    border-radius:10px;
    overflow:hidden;
    flex:none;
    box-shadow:0 1px 4px rgba(0,0,0,0.35);
  }
  .seg-label .logo-badge img{ width:100%; height:100%; display:block; object-fit:cover; }
  .seg-label span{
    display:block;
    color:#fff;
    font-weight:800;
    font-size:14.5px;
    line-height:1;
    white-space:nowrap;
    text-transform:uppercase;
    letter-spacing:0;
    text-shadow:0 1px 3px rgba(0,0,0,0.35);
  }

  .hub{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:64px; height:64px;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 6px 18px rgba(0,0,0,0.35);
    z-index:4;
  }
  .hub img{ width:36px; height:36px; border-radius:8px; object-fit:cover; }

  .spin-btn{
    appearance:none;
    border:none;
    cursor:pointer;
    background:var(--btn-bg);
    color:var(--btn-ink);
    font-size:clamp(17px, 4.5vw, 21px);
    font-weight:800;
    letter-spacing:0.02em;
    padding:17px 58px;
    border-radius:999px;
    text-transform:uppercase;
    box-shadow:0 10px 24px -8px rgba(0,0,0,0.5);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .spin-btn:hover{ transform:translateY(-1px); box-shadow:0 14px 28px -8px rgba(0,0,0,0.55); }
  .spin-btn:active{ transform:translateY(1px) scale(0.98); }
  .spin-btn:disabled{ opacity:0.4; cursor:default; transform:none; }

  /* gear */
  .gear-btn{
    position:fixed;
    top:18px; right:18px;
    width:38px; height:38px;
    border-radius:50%;
    border:none;
    background:var(--surface);
    color:var(--ink);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:15;
  }
  .gear-btn svg{ width:18px; height:18px; }
  .gear-btn:hover{ background:var(--surface-hover); }

  /* settings panel */
  .backdrop{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.6);
    opacity:0; pointer-events:none;
    transition:opacity 0.2s ease;
    z-index:20;
  }
  .backdrop.open{ opacity:1; pointer-events:auto; }

  .panel{
    position:fixed;
    top:0; right:0;
    height:100%;
    width:min(340px, 88vw);
    background:var(--card);
    box-shadow:-20px 0 50px rgba(0,0,0,0.4);
    transform:translateX(100%);
    transition:transform 0.25s ease;
    z-index:21;
    padding:24px;
    overflow-y:auto;
    color:var(--ink);
  }
  .panel.open{ transform:translateX(0); }
  .panel h2{ font-size:16px; margin:0 0 4px; color:var(--ink); font-weight:700; }
  .panel h2.spaced{ margin-top:22px; }
  .panel .sub{ font-size:12.5px; color:var(--ink-dim); margin:0 0 18px; }
  .panel .close{
    position:absolute; top:20px; right:20px;
    border:none; background:none; font-size:18px; cursor:pointer; color:var(--ink-dim);
  }

  .mode-row{
    display:flex; gap:4px; margin-bottom:18px;
    background:var(--surface); padding:4px; border-radius:12px;
  }
  .mode-row button{
    flex:1; border:none; background:transparent;
    padding:9px 8px; border-radius:9px; font-size:13px; font-weight:700;
    cursor:pointer; color:var(--ink-dim);
  }
  .mode-row button.active{ background:var(--btn-bg); color:var(--btn-ink); }

  .use-case-list{ display:flex; flex-direction:column; gap:6px; }
  .use-case-list.disabled .uc-row{ opacity:0.35; pointer-events:none; }
  .uc-item{ display:flex; flex-direction:column; }
  .uc-row{
    position:relative;
    display:flex; align-items:center; gap:10px;
    padding:9px 36px 9px 10px; border-radius:10px;
    border:none;
    background:transparent;
    cursor:pointer; font-size:13.5px; font-weight:600;
  }
  .uc-row .logo-badge{ width:28px; height:28px; border-radius:7px; overflow:hidden; flex:none; }
  .uc-row .logo-badge img{ width:100%; height:100%; object-fit:cover; }
  .uc-row span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .uc-row.selected{ background:var(--surface); }
  .uc-row input{ display:none; }

  .sound-row{ width:100%; font-family:inherit; text-align:left; }

  .edit-btn{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    width:26px; height:26px; border:none; border-radius:7px;
    background:transparent; cursor:pointer; color:var(--ink-dim);
    display:flex; align-items:center; justify-content:center;
  }
  .edit-btn:hover{ background:var(--surface); color:var(--ink); }
  .edit-btn svg{ width:14px; height:14px; }
  .use-case-list.disabled .edit-btn{ opacity:1; pointer-events:auto; }

  .uc-edit{ display:none; padding:8px 4px 16px; }
  .uc-edit.open{ display:block; }
  .name-input{
    width:100%; box-sizing:border-box; font-family:inherit;
    background:var(--surface); border:none; border-radius:8px;
    padding:9px 10px; color:var(--ink); font-size:13.5px; font-weight:600;
    margin-bottom:10px;
  }
  .name-input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .icon-grid{ display:grid; grid-template-columns:repeat(6, 1fr); gap:6px; }
  .icon-opt{
    border:none; border-radius:8px; padding:3px; cursor:pointer;
    background:transparent; aspect-ratio:1; display:flex; align-items:center; justify-content:center;
  }
  .icon-opt img{ width:100%; height:100%; border-radius:6px; object-fit:cover; display:block; }
  .icon-opt.selected{ background:var(--surface); box-shadow:0 0 0 2px var(--accent) inset; }

  /* result overlay */
  .result-backdrop{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.75);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity 0.25s ease;
    z-index:30;
    padding:20px;
  }
  .result-backdrop.open{ opacity:1; pointer-events:auto; }
  .result-card{
    background:var(--card);
    border-radius:28px;
    max-width:360px;
    width:100%;
    padding:40px 28px 32px;
    text-align:center;
    transform:scale(0.85) translateY(10px);
    transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
    color:var(--ink);
  }
  .result-backdrop.open .result-card{ transform:scale(1) translateY(0); }
  .result-logos{
    display:flex; align-items:center; justify-content:center;
    gap:16px; margin-bottom:26px;
  }
  .result-logos .logo-badge{ width:64px; height:64px; border-radius:16px; overflow:hidden; flex:none; box-shadow:0 4px 14px rgba(0,0,0,0.3); }
  .result-logos .logo-badge img{ width:100%; height:100%; object-fit:cover; }
  .result-logos .x{ font-size:20px; font-weight:600; color:var(--ink-dim); }
  .result-card h3{
    font-size:clamp(24px, 7vw, 32px);
    margin:0;
    letter-spacing:0.01em;
    text-transform:uppercase;
    font-weight:900;
    color:var(--ink);
  }
  .again-btn{
    appearance:none; border:none; cursor:pointer;
    background:var(--btn-bg); color:var(--btn-ink); font-weight:700; font-size:14px;
    text-transform:uppercase; letter-spacing:0.02em;
    padding:13px 22px; border-radius:999px; width:100%;
    margin-top:28px;
  }
</style>
</head>
<body>

  <button class="gear-btn" id="gearBtn" title="Settings" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M19.4 13a7.6 7.6 0 0 0 .07-1 7.6 7.6 0 0 0-.07-1l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.5 7.5 0 0 0-1.73-1L14.5 2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.42 2.6a7.5 7.5 0 0 0-1.73 1l-2.39-.96a.5.5 0 0 0-.6.22L2.44 8.78a.5.5 0 0 0 .12.64L4.6 11a7.6 7.6 0 0 0 0 2l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96a7.5 7.5 0 0 0 1.73 1l.42 2.6a.5.5 0 0 0 .5.4h4a.5.5 0 0 0 .5-.4l.42-2.6a7.5 7.5 0 0 0 1.73-1l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64L19.4 13Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.4"/>
    </svg>
  </button>

  <header>
    <div class="brand">
      <img src="assets/orth-logo.jpg" alt="Orthogonal" />
      <h1>ORTH MONEYMAKER</h1>
    </div>
  </header>

  <div class="stage">
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <div class="dial" id="dial"></div>
      <div class="hub"><img src="assets/orth-logo.jpg" alt="" /></div>
    </div>
    <button class="spin-btn" id="spinBtn">SPIN</button>
  </div>

  <div class="backdrop" id="backdrop"></div>
  <div class="panel" id="panel">
    <button class="close" id="closePanel">✕</button>
    <h2>Settings</h2>
    <p class="sub">Choose how the wheel picks its result.</p>

    <div class="mode-row">
      <button id="modeRandom" class="active">Random</button>
      <button id="modeLocked">Set the winner</button>
    </div>

    <div class="use-case-list disabled" id="ucList"></div>

    <h2 class="spaced">Result sound</h2>
    <p class="sub">Plays when the wheel lands. Tap to preview and select.</p>
    <div class="use-case-list" id="soundList"></div>

    <h2 class="spaced">Appearance</h2>
    <p class="sub">Switch between dark and light.</p>
    <div class="mode-row">
      <button id="themeDark" class="active">Dark</button>
      <button id="themeLight">Light</button>
    </div>
  </div>

  <div class="result-backdrop" id="resultBackdrop">
    <div class="result-card">
      <div class="result-logos">
        <div class="logo-badge"><img id="rLogo" src="" alt="" /></div>
        <span class="x">×</span>
        <div class="logo-badge"><img src="assets/orth-logo.jpg" alt="Orthogonal" /></div>
      </div>
      <h3 id="rTitle">Title</h3>
      <button class="again-btn" id="againBtn">Spin again</button>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script>
  // Source: Orthogonal "Use Case Playground" sheet, reframed as recognizable
  // money-making plays for on-camera reveals. Segments are editable at
  // runtime (name + icon) from the settings panel; edits persist locally.
  const DEFAULT_SEGMENTS = [
    { label: "META ADS SPY",  logo: "assets/logos/facebook.svg",   color: "#E8483F" },
    { label: "VIRAL VIDEOS",  logo: "assets/logos/tiktok.svg",     color: "#2F80ED" },
    { label: "BRAND DEALS",   logo: "assets/logos/instagram.png",  color: "#F2B705" },
    { label: "DEAL BOT",      logo: "assets/logos/amazon.svg",     color: "#27AE60" },
    { label: "LOCAL LEADS",   logo: "assets/logos/googlemaps.svg", color: "#8E44AD" },
    { label: "COLD EMAIL",    logo: "assets/logos/gmail.svg",      color: "#E0218A" },
    { label: "GET A JOB",     logo: "assets/logos/linkedin.png",   color: "#17A398" },
    { label: "SHOPIFY SPY",   logo: "assets/logos/shopify.svg",    color: "#F2622E" }
  ];

  let SEGMENTS = DEFAULT_SEGMENTS;
  try {
    const saved = JSON.parse(localStorage.getItem('omm_segments') || 'null');
    if (Array.isArray(saved) && saved.length === DEFAULT_SEGMENTS.length) SEGMENTS = saved;
  } catch (e) {}

  function saveSegments(){
    localStorage.setItem('omm_segments', JSON.stringify(SEGMENTS));
  }

  // Generic (non-brand) icon options are an emoji centered on a neutral
  // badge, encoded as an inline SVG data URI — no extra asset files, and it
  // slots into the same <img>-based badge system as the fetched brand logos.
  function emojiIcon(emoji){
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#2A2A30"/><text x="50" y="67" font-size="52" text-anchor="middle">${emoji}</text></svg>`;
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  }

  const ICON_LIBRARY = [
    { id:'facebook',   name:'Meta',        src:'assets/logos/facebook.svg' },
    { id:'tiktok',     name:'TikTok',      src:'assets/logos/tiktok.svg' },
    { id:'instagram',  name:'Instagram',   src:'assets/logos/instagram.png' },
    { id:'amazon',     name:'Amazon',      src:'assets/logos/amazon.svg' },
    { id:'googlemaps', name:'Google Maps', src:'assets/logos/googlemaps.svg' },
    { id:'gmail',      name:'Gmail',       src:'assets/logos/gmail.svg' },
    { id:'linkedin',   name:'LinkedIn',    src:'assets/logos/linkedin.png' },
    { id:'shopify',    name:'Shopify',     src:'assets/logos/shopify.svg' },
    { id:'dollar',     name:'Dollar',      src: emojiIcon('💵') },
    { id:'briefcase',  name:'Briefcase',   src: emojiIcon('💼') },
    { id:'star',       name:'Star',        src: emojiIcon('⭐') },
    { id:'rocket',     name:'Rocket',      src: emojiIcon('🚀') },
    { id:'trophy',     name:'Trophy',      src: emojiIcon('🏆') },
    { id:'megaphone',  name:'Megaphone',   src: emojiIcon('📣') },
    { id:'phone',      name:'Phone',       src: emojiIcon('📱') },
    { id:'default',    name:'Default',     src: emojiIcon('✨') }
  ];

  const N = SEGMENTS.length;
  const SEG_ANGLE = 360 / N;
  const dial = document.getElementById('dial');
  const ucList = document.getElementById('ucList');

  const stops = [];
  for (let i = 0; i < N; i++) {
    const start = i * SEG_ANGLE;
    const end = (i + 1) * SEG_ANGLE;
    stops.push(`${SEGMENTS[i].color} ${start}deg ${end}deg`);
  }
  dial.style.background = `conic-gradient(${stops.join(', ')})`;

  function logoBadge(src, alt){
    const badge = document.createElement('div');
    badge.className = 'logo-badge';
    const img = document.createElement('img');
    img.src = src;
    img.alt = alt || '';
    badge.appendChild(img);
    return badge;
  }

  // Logo sits near the rim (outer), label text sits just inside it (inner),
  // tight together as one visual pair — both measured as pixel distance from
  // wheel center along the wedge's own bisector, so the flip-for-readability
  // rotation below can't swap them. LABEL_MAX_WIDTH — not the measured width
  // of whatever text happens to be in a segment — drives the layout math, so
  // a long custom name (segments are user-editable) can never push the
  // wheel's geometry around; instead it wraps to two lines and shrinks
  // within that fixed box (see layoutLabel below).
  const dialRadius = dial.clientWidth / 2;
  const hubRadius = document.querySelector('.hub').clientWidth / 2;
  const LOGO_SIZE = 37;
  const LABEL_MAX_WIDTH = 100;
  const LABEL_BASE_SIZE = 14.5;
  const LABEL_WRAP_SIZE = 12;

  const measurer = document.createElement('span');
  measurer.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font-weight:800;text-transform:uppercase;font-family:inherit;';
  document.body.appendChild(measurer);

  function layoutLabel(span, text){
    span.textContent = text;
    measurer.style.fontSize = LABEL_BASE_SIZE + 'px';
    measurer.textContent = text;
    const natural = measurer.getBoundingClientRect().width;
    if (natural > LABEL_MAX_WIDTH) {
      span.style.fontSize = LABEL_WRAP_SIZE + 'px';
      span.style.whiteSpace = 'normal';
      span.style.width = LABEL_MAX_WIDTH + 'px';
      span.style.textAlign = 'center';
    } else {
      span.style.fontSize = LABEL_BASE_SIZE + 'px';
      span.style.whiteSpace = 'nowrap';
      span.style.width = 'auto';
      span.style.textAlign = 'left';
    }
  }

  // Anchor the LOGO to the rim (not to the hub) so the pair scales with however
  // big the wheel actually renders — anchoring from the hub instead produced a
  // fixed small radius that left the whole outer ring of the wheel empty on
  // larger screens. Text sits just inside the logo, working backward from it.
  const R_LOGO = dialRadius - LOGO_SIZE - 8;
  const R_TEXT = Math.max(hubRadius + 8, R_LOGO - LABEL_MAX_WIDTH - 8);

  function radialItem(radius, el){
    const item = document.createElement('div');
    item.className = 'r-item';
    item.style.transform = `translate(${radius}px, -50%)`;
    item.appendChild(el);
    return item;
  }

  const wheelLabelSpans = [];
  const wheelLogoImgs = [];

  SEGMENTS.forEach((s, i) => {
    const mid = i * SEG_ANGLE + SEG_ANGLE / 2 - 90;
    const wrap = document.createElement('div');
    wrap.className = 'seg-label';
    wrap.style.transform = `rotate(${mid}deg)`;

    const normalizedMid = ((mid % 360) + 360) % 360;
    const flip = normalizedMid > 90 && normalizedMid < 270;
    const flipStyle = flip ? 'rotate(180deg)' : '';

    const badge = logoBadge(s.logo, s.label);
    const logoFlip = document.createElement('div');
    logoFlip.style.transform = flipStyle;
    logoFlip.appendChild(badge);

    const span = document.createElement('span');
    layoutLabel(span, s.label);
    const textFlip = document.createElement('div');
    textFlip.style.transform = flipStyle;
    textFlip.appendChild(span);

    wrap.appendChild(radialItem(R_TEXT, textFlip));
    wrap.appendChild(radialItem(R_LOGO, logoFlip));
    dial.appendChild(wrap);

    wheelLabelSpans[i] = span;
    wheelLogoImgs[i] = badge.querySelector('img');
  });

  // ---- settings: use-case rows (click to rig, pencil to rename/re-icon) ----
  const PENCIL_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 20h4L18.5 9.5a2.12 2.12 0 0 0-3-3L5 17v3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>';

  const ucRowSpans = [];
  const ucRowImgs = [];

  function toggleEdit(i){
    const el = document.getElementById(`ucEdit${i}`);
    const wasOpen = el.classList.contains('open');
    document.querySelectorAll('.uc-edit.open').forEach(x => x.classList.remove('open'));
    if (!wasOpen) el.classList.add('open');
  }

  function updateLabel(i, value){
    SEGMENTS[i].label = value;
    ucRowSpans[i].textContent = value;
    layoutLabel(wheelLabelSpans[i], value);
    saveSegments();
  }

  function updateIcon(i, src){
    SEGMENTS[i].logo = src;
    ucRowImgs[i].src = src;
    wheelLogoImgs[i].src = src;
    saveSegments();
  }

  function buildUcRow(i){
    const item = document.createElement('div');
    item.className = 'uc-item';

    const row = document.createElement('label');
    row.className = 'uc-row';
    row.innerHTML = `<input type="radio" name="ucChoice" value="${i}" />`;
    const badge = logoBadge(SEGMENTS[i].logo, SEGMENTS[i].label);
    row.appendChild(badge);
    const span = document.createElement('span');
    span.textContent = SEGMENTS[i].label;
    row.appendChild(span);
    row.addEventListener('click', () => selectLocked(i));

    const editBtn = document.createElement('button');
    editBtn.type = 'button';
    editBtn.className = 'edit-btn';
    editBtn.title = 'Rename or change icon';
    editBtn.innerHTML = PENCIL_SVG;
    editBtn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      toggleEdit(i);
    });
    row.appendChild(editBtn);
    item.appendChild(row);

    const edit = document.createElement('div');
    edit.className = 'uc-edit';
    edit.id = `ucEdit${i}`;

    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.className = 'name-input';
    nameInput.maxLength = 32;
    nameInput.value = SEGMENTS[i].label;
    nameInput.addEventListener('input', () => {
      const words = nameInput.value.split(/\s+/).filter(Boolean);
      if (words.length > 4) nameInput.value = words.slice(0, 4).join(' ');
      updateLabel(i, nameInput.value);
    });
    edit.appendChild(nameInput);

    const grid = document.createElement('div');
    grid.className = 'icon-grid';
    ICON_LIBRARY.forEach(icon => {
      const opt = document.createElement('button');
      opt.type = 'button';
      opt.className = 'icon-opt';
      opt.title = icon.name;
      if (icon.src === SEGMENTS[i].logo) opt.classList.add('selected');
      const img = document.createElement('img');
      img.src = icon.src;
      img.alt = icon.name;
      opt.appendChild(img);
      opt.addEventListener('click', () => {
        updateIcon(i, icon.src);
        grid.querySelectorAll('.icon-opt').forEach(x => x.classList.remove('selected'));
        opt.classList.add('selected');
      });
      grid.appendChild(opt);
    });
    edit.appendChild(grid);

    item.appendChild(edit);

    ucRowSpans[i] = span;
    ucRowImgs[i] = badge.querySelector('img');
    return item;
  }

  SEGMENTS.forEach((s, i) => ucList.appendChild(buildUcRow(i)));

  // ---- state ----
  let mode = localStorage.getItem('omm_mode') || 'random'; // 'random' | 'locked'
  let lockedIndex = localStorage.getItem('omm_locked');
  lockedIndex = lockedIndex === null || lockedIndex === '' ? null : parseInt(lockedIndex, 10);
  let rotation = 0;
  let spinning = false;

  function saveState(){
    localStorage.setItem('omm_mode', mode);
    localStorage.setItem('omm_locked', lockedIndex === null ? '' : String(lockedIndex));
  }

  function selectLocked(i){
    lockedIndex = i;
    mode = 'locked';
    setModeUI();
    saveState();
  }

  function setModeUI(){
    document.getElementById('modeRandom').classList.toggle('active', mode === 'random');
    document.getElementById('modeLocked').classList.toggle('active', mode === 'locked');
    ucList.classList.toggle('disabled', mode !== 'locked');
    document.querySelectorAll('.uc-row').forEach((row, i) => {
      row.classList.toggle('selected', mode === 'locked' && lockedIndex === i);
    });
  }
  setModeUI();

  // ---- theme ----
  const THEME_KEY = 'omm_theme';
  let theme = localStorage.getItem(THEME_KEY) || 'dark';
  function applyTheme(){
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('themeDark').classList.toggle('active', theme === 'dark');
    document.getElementById('themeLight').classList.toggle('active', theme === 'light');
  }
  applyTheme();
  document.getElementById('themeDark').addEventListener('click', () => {
    theme = 'dark'; localStorage.setItem(THEME_KEY, theme); applyTheme();
  });
  document.getElementById('themeLight').addEventListener('click', () => {
    theme = 'light'; localStorage.setItem(THEME_KEY, theme); applyTheme();
  });

  // ---- panel open/close ----
  const panel = document.getElementById('panel');
  const backdrop = document.getElementById('backdrop');
  function openPanel(){ panel.classList.add('open'); backdrop.classList.add('open'); }
  function closePanel(){ panel.classList.remove('open'); backdrop.classList.remove('open'); }
  document.getElementById('gearBtn').addEventListener('click', openPanel);
  document.getElementById('closePanel').addEventListener('click', closePanel);
  backdrop.addEventListener('click', closePanel);

  document.getElementById('modeRandom').addEventListener('click', () => {
    mode = 'random'; setModeUI(); saveState();
  });
  document.getElementById('modeLocked').addEventListener('click', () => {
    mode = 'locked';
    if (lockedIndex === null) lockedIndex = 0;
    setModeUI(); saveState();
  });

  // ---- sound: result reveal (user-selectable) + synthesized spin ticks ----
  const RESULT_SOUNDS = [
    { id: 'fahh',             name: 'Fahhh',             src: 'assets/sounds/fahh.mp3' },
    { id: 'vine-boom',        name: 'Vine Boom',         src: 'assets/sounds/vine-boom.mp3' },
    { id: 'rizz',             name: 'Rizz',              src: 'assets/sounds/rizz.mp3' },
    { id: 'anime-wow',        name: 'Anime Wow',         src: 'assets/sounds/anime-wow.mp3' },
    { id: 'metal-pipe-clang', name: 'Metal Pipe Clang',  src: 'assets/sounds/metal-pipe-clang.mp3' }
  ];

  let resultSoundId = localStorage.getItem('omm_result_sound') || RESULT_SOUNDS[0].id;
  const soundList = document.getElementById('soundList');

  function setSoundUI(){
    Array.from(soundList.children).forEach((row, i) => {
      row.classList.toggle('selected', RESULT_SOUNDS[i].id === resultSoundId);
    });
  }

  function selectResultSound(id, preview){
    resultSoundId = id;
    localStorage.setItem('omm_result_sound', id);
    setSoundUI();
    if (preview) playResultSound();
  }

  function playResultSound(){
    const s = RESULT_SOUNDS.find(x => x.id === resultSoundId);
    if (!s) return;
    new Audio(s.src).play().catch(() => {});
  }

  RESULT_SOUNDS.forEach(s => {
    const row = document.createElement('button');
    row.type = 'button';
    row.className = 'uc-row sound-row';
    row.textContent = s.name;
    row.addEventListener('click', () => selectResultSound(s.id, true));
    soundList.appendChild(row);
  });
  setSoundUI();

  // Spin-in-progress sound is synthesized (Web Audio tick) rather than a
  // looping asset — no extra file to fetch, and the tick cadence just needs
  // to slow down over SPIN_DURATION_MS to read as "wheel decelerating".
  let audioCtx = null;
  function ensureAudioCtx(){
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playTick(){
    const ctx = ensureAudioCtx();
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(900, t);
    gain.gain.setValueAtTime(0.15, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.06);
  }

  const SPIN_DURATION_MS = 4400; // must match .dial transition-duration

  function startSpinTicks(){
    const start = performance.now();
    let stopped = false;
    (function schedule(){
      if (stopped) return;
      const frac = Math.min((performance.now() - start) / SPIN_DURATION_MS, 1);
      if (frac >= 1) return;
      playTick();
      setTimeout(schedule, 35 + frac * frac * 260); // gap widens as wheel slows
    })();
    return () => { stopped = true; };
  }

  // ---- spin logic ----
  const spinBtn = document.getElementById('spinBtn');
  const resultBackdrop = document.getElementById('resultBackdrop');

  function pickTargetIndex(){
    if (mode === 'locked' && lockedIndex !== null) return lockedIndex;
    return Math.floor(Math.random() * N);
  }

  function celebrate(){
    if (typeof confetti !== 'function') return;
    const colors = SEGMENTS.map(s => s.color);
    confetti({ particleCount: 140, spread: 80, startVelocity: 50, origin: { y: 0.55 }, colors });
    confetti({ particleCount: 80, angle: 60, spread: 55, origin: { x: 0, y: 0.7 }, colors });
    confetti({ particleCount: 80, angle: 120, spread: 55, origin: { x: 1, y: 0.7 }, colors });
  }

  function showResult(i){
    const s = SEGMENTS[i];
    document.getElementById('rLogo').src = s.logo;
    document.getElementById('rTitle').textContent = s.label;
    resultBackdrop.classList.add('open');
    celebrate();
    playResultSound();
  }

  function doSpin(){
    if (spinning) return;
    spinning = true;
    spinBtn.disabled = true;

    const targetIndex = pickTargetIndex();
    const centerAngle = targetIndex * SEG_ANGLE + SEG_ANGLE / 2;
    const jitter = (Math.random() - 0.5) * SEG_ANGLE * 0.6;
    const targetVisualAngle = ((centerAngle + jitter) % 360 + 360) % 360;

    const currentMod = ((rotation % 360) + 360) % 360;
    const neededForward = ((360 - targetVisualAngle) - currentMod + 360) % 360;
    const extraSpins = 6 + Math.floor(Math.random() * 3); // 6-8 full turns
    rotation += extraSpins * 360 + neededForward;

    dial.style.transform = `rotate(${rotation}deg)`;
    const stopTicks = startSpinTicks();

    const onDone = () => {
      dial.removeEventListener('transitionend', onDone);
      stopTicks();
      const normalized = ((rotation % 360) + 360) % 360;
      dial.style.transition = 'none';
      dial.style.transform = `rotate(${normalized}deg)`;
      rotation = normalized;
      void dial.offsetHeight;
      dial.style.transition = '';

      spinning = false;
      spinBtn.disabled = false;
      showResult(targetIndex);
    };
    dial.addEventListener('transitionend', onDone);
  }

  spinBtn.addEventListener('click', doSpin);

  document.getElementById('againBtn').addEventListener('click', () => {
    resultBackdrop.classList.remove('open');
  });

  // Spacebar spins the wheel from anywhere, except while typing in a field.
  document.addEventListener('keydown', (e) => {
    if (e.code !== 'Space') return;
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || (document.activeElement && document.activeElement.isContentEditable)) return;
    e.preventDefault();
    resultBackdrop.classList.remove('open');
    doSpin();
  });
</script>
</body>
</html>
