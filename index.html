<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orth Moneymaker</title>
<link rel="icon" href="assets/orth-logo.jpg" />
<style>
  :root{
    --ink:#0a0a0a;
    --paper:#faf9f7;
    --card:#ffffff;
    --line:rgba(10,10,10,0.08);
    --shadow: 0 30px 60px -20px rgba(0,0,0,0.25), 0 10px 20px -10px rgba(0,0,0,0.12);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:28px;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,95,80,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(77,166,255,0.10), transparent 40%),
      var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, ui-sans-serif, sans-serif;
    color:var(--ink);
    overflow-x:hidden;
    padding:32px 16px;
  }

  header{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    text-align:center;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand img{ width:28px; height:28px; border-radius:6px; }
  .brand h1{
    font-size:22px;
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0;
  }
  header p{
    margin:0;
    font-size:14px;
    color:rgba(10,10,10,0.5);
  }

  .stage{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:26px;
  }

  .pointer{
    position:absolute;
    top:-14px;
    left:50%;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:16px solid transparent;
    border-right:16px solid transparent;
    border-top:26px solid var(--ink);
    filter:drop-shadow(0 3px 4px rgba(0,0,0,0.25));
    z-index:5;
  }

  .wheel-wrap{
    position:relative;
    width:min(78vw, 380px);
    height:min(78vw, 380px);
    border-radius:50%;
    box-shadow:var(--shadow);
    background:var(--card);
    padding:8px;
  }
  .dial{
    position:relative;
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
    transform:rotate(0deg);
    transition: transform 4.4s cubic-bezier(0.16, 0.86, 0.2, 1);
    border:3px solid rgba(255,255,255,0.9);
  }
  .seg-label{
    position:absolute;
    top:50%; left:50%;
    width:46%;
    height:0;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    transform-origin:left center;
    pointer-events:none;
  }
  .seg-label span{
    display:block;
    max-width:100px;
    color:#fff;
    font-weight:700;
    font-size:12.5px;
    line-height:1.15;
    text-align:right;
    text-shadow:0 1px 3px rgba(0,0,0,0.35);
    letter-spacing:0.01em;
  }

  .hub{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:76px; height:76px;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.2), inset 0 0 0 1px var(--line);
    z-index:4;
  }
  .hub img{
    width:44px; height:44px;
    border-radius:8px;
    object-fit:cover;
  }

  .spin-btn{
    appearance:none;
    border:none;
    cursor:pointer;
    background:var(--ink);
    color:#fff;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.01em;
    padding:16px 40px;
    border-radius:999px;
    box-shadow:0 10px 24px -8px rgba(0,0,0,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }
  .spin-btn:hover{ transform:translateY(-1px); box-shadow:0 14px 28px -8px rgba(0,0,0,0.45); }
  .spin-btn:active{ transform:translateY(1px) scale(0.98); }
  .spin-btn:disabled{ opacity:0.5; cursor:default; transform:none; }

  .lock-pill{
    display:none;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
    background:#fff;
    border:1px solid var(--line);
    padding:6px 12px;
    border-radius:999px;
  }
  .lock-pill.show{ display:inline-flex; }

  /* gear */
  .gear-btn{
    position:fixed;
    top:20px; right:20px;
    width:42px; height:42px;
    border-radius:50%;
    border:1px solid var(--line);
    background:#fff;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
  }
  .gear-btn:hover{ background:#f2f1ee; }

  /* settings panel */
  .backdrop{
    position:fixed; inset:0;
    background:rgba(10,10,10,0.35);
    opacity:0; pointer-events:none;
    transition:opacity 0.2s ease;
    z-index:20;
  }
  .backdrop.open{ opacity:1; pointer-events:auto; }

  .panel{
    position:fixed;
    top:0; right:0;
    height:100%;
    width:min(340px, 88vw);
    background:#fff;
    box-shadow:-20px 0 40px rgba(0,0,0,0.15);
    transform:translateX(100%);
    transition:transform 0.25s ease;
    z-index:21;
    padding:22px;
    overflow-y:auto;
  }
  .panel.open{ transform:translateX(0); }
  .panel h2{ font-size:16px; margin:0 0 4px; }
  .panel .sub{ font-size:12.5px; color:rgba(10,10,10,0.5); margin:0 0 18px; }
  .panel .close{
    position:absolute; top:18px; right:18px;
    border:none; background:none; font-size:18px; cursor:pointer; color:rgba(10,10,10,0.5);
  }

  .mode-row{
    display:flex;
    gap:8px;
    margin-bottom:16px;
    background:#f2f1ee;
    padding:4px;
    border-radius:12px;
  }
  .mode-row button{
    flex:1;
    border:none;
    background:transparent;
    padding:9px 8px;
    border-radius:9px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    color:rgba(10,10,10,0.55);
  }
  .mode-row button.active{
    background:#fff;
    color:var(--ink);
    box-shadow:0 2px 6px rgba(0,0,0,0.12);
  }

  .use-case-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .use-case-list.disabled{ opacity:0.4; pointer-events:none; }
  .uc-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border-radius:10px;
    border:1.5px solid var(--line);
    cursor:pointer;
    font-size:13.5px;
    font-weight:600;
  }
  .uc-row .dot{ width:10px; height:10px; border-radius:50%; flex:none; }
  .uc-row.selected{ border-color:var(--ink); background:#f7f7f5; }
  .uc-row input{ display:none; }

  /* result overlay */
  .result-backdrop{
    position:fixed; inset:0;
    background:rgba(10,10,10,0.45);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity 0.25s ease;
    z-index:30;
    padding:20px;
  }
  .result-backdrop.open{ opacity:1; pointer-events:auto; }
  .result-card{
    background:#fff;
    border-radius:24px;
    max-width:380px;
    width:100%;
    padding:32px 28px 28px;
    text-align:center;
    transform:scale(0.85) translateY(10px);
    transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow:var(--shadow);
  }
  .result-backdrop.open .result-card{ transform:scale(1) translateY(0); }
  .result-emoji{ font-size:52px; line-height:1; margin-bottom:10px; }
  .result-tag{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:#fff;
    padding:4px 10px;
    border-radius:999px;
    margin-bottom:10px;
  }
  .result-card h3{ font-size:21px; margin:0 0 8px; letter-spacing:-0.01em; }
  .result-card p.desc{ font-size:14.5px; color:rgba(10,10,10,0.7); margin:0 0 16px; line-height:1.45; }
  .hook-box{
    background:#f7f7f5;
    border-radius:12px;
    padding:12px 14px;
    font-size:13px;
    font-style:italic;
    color:rgba(10,10,10,0.75);
    margin-bottom:10px;
    text-align:left;
  }
  .prompt-box{
    background:#0a0a0a;
    color:#e8e8e6;
    border-radius:12px;
    padding:12px 14px;
    font-size:12.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    text-align:left;
    margin-bottom:18px;
    line-height:1.45;
  }
  .prompt-box .k{ color:rgba(255,255,255,0.4); display:block; margin-bottom:4px; font-family:inherit; text-transform:uppercase; font-size:10px; letter-spacing:0.05em;}
  .again-btn{
    appearance:none; border:none; cursor:pointer;
    background:var(--ink); color:#fff; font-weight:700; font-size:14px;
    padding:12px 22px; border-radius:999px; width:100%;
  }

  footer{ font-size:11.5px; color:rgba(10,10,10,0.35); }
</style>
</head>
<body>

  <button class="gear-btn" id="gearBtn" title="Set the winner">⚙️</button>

  <header>
    <div class="brand">
      <img src="assets/orth-logo.jpg" alt="Orthogonal" />
      <h1>Orth Moneymaker</h1>
    </div>
    <p>Spin it on camera. Get your next video idea in one take.</p>
  </header>

  <div class="stage">
    <div class="lock-pill" id="lockPill">🔒 <span id="lockPillText"></span></div>
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <div class="dial" id="dial"></div>
      <div class="hub"><img src="assets/orth-logo.jpg" alt="" /></div>
    </div>
    <button class="spin-btn" id="spinBtn">SPIN THE WHEEL</button>
  </div>

  <footer>Orthogonal · orthogonal.com</footer>

  <div class="backdrop" id="backdrop"></div>
  <div class="panel" id="panel">
    <button class="close" id="closePanel">✕</button>
    <h2>Rig the wheel</h2>
    <p class="sub">Filming one use case and don't want extra takes? Lock a winner below.</p>

    <div class="mode-row">
      <button id="modeRandom" class="active">Random</button>
      <button id="modeLocked">Set the winner</button>
    </div>

    <div class="use-case-list disabled" id="ucList"></div>
  </div>

  <div class="result-backdrop" id="resultBackdrop">
    <div class="result-card">
      <div class="result-emoji" id="rEmoji">🎯</div>
      <div class="result-tag" id="rTag">GTM</div>
      <h3 id="rTitle">Title</h3>
      <p class="desc" id="rDesc">Description</p>
      <div class="hook-box" id="rHook">Hook</div>
      <div class="prompt-box"><span class="k">Try this prompt</span><span id="rPrompt"></span></div>
      <button class="again-btn" id="againBtn">Spin again</button>
    </div>
  </div>

<script>
  // Source: Orthogonal "Use Case Playground" sheet, curated for on-camera reveals.
  const SEGMENTS = [
    {
      label: "COPY ANY\nBRAND'S ADS",
      emoji: "🎯",
      color: "#FF5A5F",
      title: "Copy Any Brand's Ads",
      tag: "Ads",
      desc: "Scrape a brand's ad library and marketing playbook, then relaunch it slightly cheaper.",
      hook: "“Post their ads but make your product slightly cheaper — you'll make just as much money.”",
      prompt: "Pull every ad this brand is currently running and break down the hook, offer, and creative angle in each one."
    },
    {
      label: "FREE LEADS,\nNO CLAY",
      emoji: "🧲",
      color: "#FFC145",
      title: "Clay.com Killer",
      tag: "GTM",
      desc: "Builds a list of real leads — name, title, company — from live databases. No made-up data.",
      hook: "“I cancelled my $400/mo Clay subscription and rebuilt it in one prompt.”",
      prompt: "Find me 25 marketing directors at Series A fintech startups in NYC."
    },
    {
      label: "STEAL THEIR\nCUSTOMERS",
      emoji: "🕵️",
      color: "#4CD787",
      title: "Steal Competitor's Customers",
      tag: "GTM",
      desc: "Detects what software any website runs, so you can target their exact users.",
      hook: "“I found every company using my competitor's tool in 10 seconds.”",
      prompt: "What's the full tech stack running on hubspot.com right now?"
    },
    {
      label: "COLD DMs\nTHAT LAND",
      emoji: "💬",
      color: "#4DA6FF",
      title: "Cold Emails That Don't Look Copy-Pasted",
      tag: "GTM",
      desc: "Reads a prospect's real recent posts so your outreach references something true.",
      hook: "“Why your cold emails get ignored — and the 2-cent fix.”",
      prompt: "Read this founder's last 5 posts and write a 3-line cold email referencing something real."
    },
    {
      label: "AUDIT ANY\nINFLUENCER",
      emoji: "🔍",
      color: "#9B6BFF",
      title: "Is This Influencer Legit?",
      tag: "Creator",
      desc: "Pulls a creator's real profile and audience data before you pay them to post.",
      hook: "“Brands: check this before you pay any influencer.”",
      prompt: "Check this creator's real bio, follower count, and recent posts before I sponsor them."
    },
    {
      label: "STEAL VIRAL\nHOOKS",
      emoji: "🪝",
      color: "#FF6FA5",
      title: "Steal Viral Hooks",
      tag: "Creator",
      desc: "Pulls the top posts on any topic and extracts the exact hook pattern from each.",
      hook: "“I reverse-engineer viral hooks with one prompt.”",
      prompt: "Get the top posts about 'AI agents' this month and break down what makes each hook work."
    },
    {
      label: "LOCAL LEADS\nIN 2 MIN",
      emoji: "📍",
      color: "#22C6B6",
      title: "Local Lead List in 2 Minutes",
      tag: "SMB",
      desc: "Builds a list of local businesses complete with phone number, rating, and website.",
      hook: "“How I'd get 50 local leads for an agency in 2 minutes.”",
      prompt: "Find every dentist in Austin with their phone number and Google rating."
    },
    {
      label: "REAL-TIME\nCITY GUIDE",
      emoji: "🗺️",
      color: "#FF9F43",
      title: "Your Real-Time City Guide",
      tag: "Consumer",
      desc: "Live, ranked local recommendations pulled from real ratings — not stale training data.",
      hook: "“Let your AI use live Google Maps as your personal concierge.”",
      prompt: "Best-rated ramen in San Francisco right now, ranked with price level and address."
    }
  ];

  const N = SEGMENTS.length;
  const SEG_ANGLE = 360 / N;

  const dial = document.getElementById('dial');
  const ucList = document.getElementById('ucList');

  // Build the colored dial background + labels once.
  const gradientStops = SEGMENTS.map((s, i) =>
    `${s.color} ${i * SEG_ANGLE}deg ${(i + 1) * SEG_ANGLE}deg`
  ).join(', ');
  dial.style.background = `conic-gradient(${gradientStops})`;

  SEGMENTS.forEach((s, i) => {
    const mid = i * SEG_ANGLE + SEG_ANGLE / 2 - 90; // -90 so 0deg segment starts at top
    const wrap = document.createElement('div');
    wrap.className = 'seg-label';
    wrap.style.transform = `rotate(${mid}deg)`;
    const normalizedMid = ((mid % 360) + 360) % 360;
    const flip = normalizedMid > 90 && normalizedMid < 270;
    const span = document.createElement('span');
    span.innerHTML = s.label.replace('\n', '<br/>');
    if (flip) span.style.transform = 'rotate(180deg)';
    wrap.appendChild(span);
    dial.appendChild(wrap);
  });

  // Build settings list.
  SEGMENTS.forEach((s, i) => {
    const row = document.createElement('label');
    row.className = 'uc-row';
    row.innerHTML = `<input type="radio" name="ucChoice" value="${i}" />
      <span class="dot" style="background:${s.color}"></span>
      <span>${s.title}</span>`;
    row.addEventListener('click', () => selectLocked(i));
    ucList.appendChild(row);
  });

  // ---- state ----
  let mode = localStorage.getItem('omm_mode') || 'random'; // 'random' | 'locked'
  let lockedIndex = localStorage.getItem('omm_locked');
  lockedIndex = lockedIndex === null ? null : parseInt(lockedIndex, 10);
  let rotation = 0;
  let spinning = false;

  function saveState(){
    localStorage.setItem('omm_mode', mode);
    localStorage.setItem('omm_locked', lockedIndex === null ? '' : String(lockedIndex));
  }

  function selectLocked(i){
    lockedIndex = i;
    mode = 'locked';
    setModeUI();
    saveState();
  }

  function setModeUI(){
    document.getElementById('modeRandom').classList.toggle('active', mode === 'random');
    document.getElementById('modeLocked').classList.toggle('active', mode === 'locked');
    ucList.classList.toggle('disabled', mode !== 'locked');
    document.querySelectorAll('.uc-row').forEach((row, i) => {
      row.classList.toggle('selected', mode === 'locked' && lockedIndex === i);
    });
    const pill = document.getElementById('lockPill');
    const pillText = document.getElementById('lockPillText');
    if (mode === 'locked' && lockedIndex !== null) {
      pill.classList.add('show');
      pillText.textContent = `Locked: ${SEGMENTS[lockedIndex].title}`;
    } else {
      pill.classList.remove('show');
    }
  }
  setModeUI();

  // ---- panel open/close ----
  const panel = document.getElementById('panel');
  const backdrop = document.getElementById('backdrop');
  function openPanel(){ panel.classList.add('open'); backdrop.classList.add('open'); }
  function closePanel(){ panel.classList.remove('open'); backdrop.classList.remove('open'); }
  document.getElementById('gearBtn').addEventListener('click', openPanel);
  document.getElementById('closePanel').addEventListener('click', closePanel);
  backdrop.addEventListener('click', closePanel);

  document.getElementById('modeRandom').addEventListener('click', () => {
    mode = 'random'; setModeUI(); saveState();
  });
  document.getElementById('modeLocked').addEventListener('click', () => {
    mode = 'locked';
    if (lockedIndex === null) lockedIndex = 0;
    setModeUI(); saveState();
  });

  // ---- spin logic ----
  const spinBtn = document.getElementById('spinBtn');
  const resultBackdrop = document.getElementById('resultBackdrop');

  function pickTargetIndex(){
    if (mode === 'locked' && lockedIndex !== null) return lockedIndex;
    return Math.floor(Math.random() * N);
  }

  function showResult(i){
    const s = SEGMENTS[i];
    document.getElementById('rEmoji').textContent = s.emoji;
    document.getElementById('rTag').textContent = s.tag;
    document.getElementById('rTag').style.background = s.color;
    document.getElementById('rTitle').textContent = s.title;
    document.getElementById('rDesc').textContent = s.desc;
    document.getElementById('rHook').textContent = s.hook;
    document.getElementById('rPrompt').textContent = s.prompt;
    resultBackdrop.classList.add('open');
  }

  spinBtn.addEventListener('click', () => {
    if (spinning) return;
    spinning = true;
    spinBtn.disabled = true;

    const targetIndex = pickTargetIndex();
    const centerAngle = targetIndex * SEG_ANGLE + SEG_ANGLE / 2;
    // land inside the middle 60% of the wedge, not dead-center every time
    const jitter = (Math.random() - 0.5) * SEG_ANGLE * 0.6;
    const targetVisualAngle = ((centerAngle + jitter) % 360 + 360) % 360;

    const currentMod = ((rotation % 360) + 360) % 360;
    const neededForward = ((360 - targetVisualAngle) - currentMod + 360) % 360;
    const extraSpins = 6 + Math.floor(Math.random() * 3); // 6-8 full turns
    rotation += extraSpins * 360 + neededForward;

    dial.style.transform = `rotate(${rotation}deg)`;

    const onDone = () => {
      dial.removeEventListener('transitionend', onDone);
      // normalize rotation instantly (no transition) so numbers don't grow forever
      const normalized = ((rotation % 360) + 360) % 360;
      dial.style.transition = 'none';
      dial.style.transform = `rotate(${normalized}deg)`;
      rotation = normalized;
      // force reflow before restoring transition
      void dial.offsetHeight;
      dial.style.transition = '';

      spinning = false;
      spinBtn.disabled = false;
      showResult(targetIndex);
    };
    dial.addEventListener('transitionend', onDone);
  });

  document.getElementById('againBtn').addEventListener('click', () => {
    resultBackdrop.classList.remove('open');
  });
</script>
</body>
</html>
